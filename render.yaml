services:
  - type: web
    name: organization-portal
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: org-portal-db
          property: connectionString
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Hackways <tmgmayankff@gmail.com>"

databases:
  - name: org-portal-db
    plan: free
    databaseName: org_portal
    user: postgres
